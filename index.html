<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="center">
      <div class="boundry">
        <div id="display" class="display">
          <p id="values" class="values">Enter</p>
        </div>
        <div id="typePad" class="typePad">
          <button class="buttons numbers">1</button>
          <button class="buttons numbers">2</button>
          <button class="buttons numbers">3</button>
          <button class="buttons numbers">4</button>
          <button class="buttons numbers">5</button>
          <button class="buttons numbers">6</button>
          <button class="buttons numbers">7</button>
          <button class="buttons numbers">8</button>
          <button class="buttons numbers">9</button>
          <button class="buttons numbers">0</button>
          <button class="buttons operation">+</button>
          <button class="buttons operation">-</button>
          <button class="buttons operation">x</button>
          <button class="buttons operation">/</button>
          <button id="equalTo" class="buttons">=</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
