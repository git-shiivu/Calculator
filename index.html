<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="center">
      <div class="boundry">
        <div id="display" class="display">
          <p id="values" class="values">Enter</p>
        </div>
        <div id="typePad" class="typePad">
          <button id="one" class="buttons">1</button>
          <button class="buttons">2</button>
          <button class="buttons">3</button>
          <button class="buttons">4</button>
          <button class="buttons">5</button>
          <button class="buttons">6</button>
          <button class="buttons">7</button>
          <button class="buttons">8</button>
          <button class="buttons">9</button>
          <button class="buttons">0</button>
          <button id="add" class="buttons">+</button>
          <button id="subtract" class="buttons">-</button>
          <button id="multiply" class="buttons">x</button>
          <button id="devision" class="buttons">/</button>
          <button id="equalTo" class="buttons">=</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
