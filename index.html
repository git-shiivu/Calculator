<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="center">
      <div class="boundry">
        <div id="display" class="display">
          <p id="values" class="values"></p>
        </div>
        <div id="typePad" class="typePad">
          <button id="CLR" class="buttons ">CLR</button>
          <button id="DEL" class="buttons ">DEL</button>
          <button class="buttons input">1</button>
          <button class="buttons input">2</button>
          <button class="buttons input">3</button>
          <button class="buttons input">4</button>
          <button class="buttons input">5</button>
          <button class="buttons input">6</button>
          <button class="buttons input">7</button>
          <button class="buttons input">8</button>
          <button class="buttons input">9</button>
          <button class="buttons input">0</button>
          <button class="buttons input">+</button>
          <button class="buttons input">-</button>
          <button class="buttons input">*</button>
          <button class="buttons input">/</button>
          <button id="equalTo" class="buttons">=</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
